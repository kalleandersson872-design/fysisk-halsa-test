<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fysisk hälsa – Skattningstest (25 frågor)</title>
  <style>
    :root{
      --bg:#0b0f1a; --card:#131a2a; --muted:#6b7280; --text:#f3f4f6; --ok:#34d399; --warn:#f59e0b; --bad:#ef4444;
      --bar:#2563eb; --bar-muted:#1f2937;
    }
    body{
      margin:0; font-family:system-ui,Arial,sans-serif;
      background:linear-gradient(120deg,#0b0f1a 0%, #0f172a 100%); color:var(--text);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .wrap{width:100%; max-width:880px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.08); border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,.35)}
    header{padding:22px 24px; border-bottom:1px solid rgba(255,255,255,.06); display:flex; justify-content:space-between}
    .content{padding:28px}
    .progress{height:10px; background:rgba(255,255,255,.06); border-radius:999px; overflow:hidden; margin-bottom:18px}
    .progress>div{height:100%; width:0%; background:linear-gradient(90deg,#60a5fa,#a78bfa)}
    .row{display:grid; grid-template-columns:160px 1fr 52px; gap:12px; align-items:center; margin:10px 0}
    .bar{height:14px; background:var(--bar-muted); border-radius:10px; overflow:hidden}
    .bar>div{height:100%; width:0%; background:linear-gradient(90deg,#2563eb,#60a5fa)}
    details{background:#0b1220; border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:10px 12px}
    summary{cursor:pointer; font-weight:bold}
    .footer{padding:16px 24px; border-top:1px solid rgba(255,255,255,.06); display:flex; justify-content:space-between}
    @media print{details{background:white; border:1px solid #ccc} summary{display:none}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <header>
      <div class="title">Fysisk hälsa – Skattningstest</div>
      <div id="badge">1/25</div>
    </header>

    <div class="content" id="screen-test">
      <div class="progress"><div id="progressBar"></div></div>
      <div id="qIndex">Fråga 1 av 25</div>
      <h2 id="qText"></h2>
      <form id="form"><div class="scale"></div></form>
      <div class="nav">
        <button id="btnPrev">Tillbaka</button>
        <button id="btnNext">Nästa</button>
      </div>
    </div>

    <div class="content hidden" id="screen-results">
      <h2>Resultat</h2>
      <div>
        <h3>Totalpoäng</h3>
        <div id="totalScore"></div>
        <div class="bar"><div id="totalBar"></div></div>
      </div>
      <h3>Delområden</h3>
      <div id="domains"></div>

      <details id="answersBlock">
        <summary>Klicka för att visa alla frågor och svar</summary>
        <ol id="answersList"></ol>
      </details>
    </div>

    <div class="footer">
      <button id="btnRestart">Starta om</button>
      <button id="btnPrint">Skriv ut</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS=[
 {t:"Jag äter regelbundet och får i mig tillräckligt med energi under dagen.",d:"Kost och energi"},
 {t:"Jag upplever att min kost är näringsrik och balanserad.",d:"Kost och energi"},
 {t:"Jag märker att det jag äter påverkar mitt humör och min ork på ett positivt sätt.",d:"Kost och energi"},
 {t:"Jag undviker ofta matvanor som jag vet försämrar min hälsa.",d:"Kost och energi"},
 {t:"Jag känner mig nöjd med mina matvanor just nu.",d:"Kost och energi"},
 {t:"Jag får tillräckligt med sömn för att känna mig utvilad.",d:"Sömn och återhämtning"},
 {t:"Jag har en kvällsrutin som gör det lättare att varva ner inför sömn.",d:"Sömn och återhämtning"},
 {t:"Jag sover ungefär samma tider varje dag.",d:"Sömn och återhämtning"},
 {t:"Jag vaknar oftast pigg och redo för dagen.",d:"Sömn och återhämtning"},
 {t:"Jag tar mig tid till återhämtning när min kropp behöver det.",d:"Sömn och återhämtning"},
 {t:"Jag rör på mig varje dag, även om det inte är träning.",d:"Fysisk aktivitet"},
 {t:"Jag tränar regelbundet (minst två gånger i veckan).",d:"Fysisk aktivitet"},
 {t:"Jag upplever att min träning/rörelse är rolig och motiverande.",d:"Fysisk aktivitet"},
 {t:"Jag känner mig stark och fysiskt kapabel i vardagen.",d:"Fysisk aktivitet"},
 {t:"Jag upplever att min kondition är tillräcklig för det jag vill göra.",d:"Fysisk aktivitet"},
 {t:"Jag har god balans mellan aktivitet och vila.",d:"Vanor och hinder"},
 {t:"Jag lyckas oftast hålla fast vid mina hälsorelaterade vanor.",d:"Vanor och hinder"},
 {t:"Jag upplever inte att tid är ett stort hinder för att ta hand om min fysiska hälsa.",d:"Vanor och hinder"},
 {t:"Jag har bra strategier för att hantera stress på ett hälsosamt sätt.",d:"Vanor och hinder"},
 {t:"Jag tycker att jag har kontroll över min fysiska hälsa i stort.",d:"Vanor och hinder"},
 {t:"Jag är nöjd med min nuvarande fysiska form.",d:"Vision och motivation"},
 {t:"Jag vet vilka små förändringar jag kan göra för att förbättra min hälsa.",d:"Vision och motivation"},
 {t:"Jag känner mig motiverad att utveckla min fysiska hälsa just nu.",d:"Vision och motivation"},
 {t:"Jag tror att förbättrad fysisk hälsa skulle påverka mitt liv positivt.",d:"Vision och motivation"},
 {t:"Jag prioriterar min fysiska hälsa i vardagen.",d:"Vision och motivation"},
];
const DOMAINS=["Kost och energi","Sömn och återhämtning","Fysisk aktivitet","Vanor och hinder","Vision och motivation"];
const SCALE={1:"Stämmer inte alls",2:"Stämmer lite",3:"Neutral/delvis",4:"Stämmer mycket",5:"Stämmer helt"};
let i=0,answers=new Array(QUESTIONS.length).fill(null);
const els={
 badge:document.getElementById("badge"),progressBar:document.getElementById("progressBar"),
 qIndex:document.getElementById("qIndex"),qText:document.getElementById("qText"),
 form:document.getElementById("form"),btnPrev:document.getElementById("btnPrev"),
 btnNext:document.getElementById("btnNext"),screenTest:document.getElementById("screen-test"),
 screenResults:document.getElementById("screen-results"),totalScore:document.getElementById("totalScore"),
 totalBar:document.getElementById("totalBar"),domains:document.getElementById("domains"),
 answersList:document.getElementById("answersList"),answersBlock:document.getElementById("answersBlock"),
 btnRestart:document.getElementById("btnRestart"),btnPrint:document.getElementById("btnPrint")
};
// bygg skala
const scaleDiv=document.createElement("div");
for(let v=1;v<=5;v++){
 let r=document.createElement("input"); r.type="radio"; r.name="score"; r.id="opt"+v; r.value=v;
 let l=document.createElement("label"); l.innerHTML=v; l.setAttribute("for","opt"+v);
 scaleDiv.appendChild(r); scaleDiv.appendChild(l);
}
els.form.appendChild(scaleDiv);

function renderQ(){
 const q=QUESTIONS[i]; els.qText.textContent=q.t;
 document.querySelectorAll("input[name=score]").forEach(r=>r.checked=false);
 if(answers[i]) document.getElementById("opt"+answers[i]).checked=true;
 els.qIndex.textContent=`Fråga ${i+1} av ${QUESTIONS.length}`;
 els.badge.textContent=`${i+1}/${QUESTIONS.length}`;
 els.btnPrev.disabled=i===0;
 els.btnNext.textContent=(i===QUESTIONS.length-1)?"Visa resultat":"Nästa";
 els.progressBar.style.width=(answers.filter(a=>a).length/QUESTIONS.length*100)+"%";
}
els.form.addEventListener("change",e=>{answers[i]=+e.target.value});
els.btnPrev.onclick=()=>{if(i>0){i--;renderQ()}};
els.btnNext.onclick=()=>{
 if(!answers[i]) return;
 if(i<QUESTIONS.length-1){i++;renderQ()} else showResults();
};

function norm(v){return ((v-1)/4)*100}
function showResults(){
 els.screenTest.classList.add("hidden");
 els.screenResults.classList.remove("hidden");
 const total=answers.reduce((s,v)=>s+norm(v),0)/answers.length;
 els.totalScore.textContent=Math.round(total)+"/100";
 els.totalBar.style.width=Math.round(total)+"%";
 els.domains.innerHTML="";
 DOMAINS.forEach(d=>{
   const vals=QUESTIONS.map((q,idx)=>q.d===d?norm(answers[idx]):null).filter(x=>x!=null);
   const score=vals.reduce((s,v)=>s+v,0)/vals.length;
   const row=document.createElement("div"); row.className="row";
   row.innerHTML=`<div>${d}</div><div class="bar"><div style="width:${score.toFixed(0)}%"></div></div><div>${score.toFixed(0)}</div>`;
   els.domains.appendChild(row);
 });
 els.answersList.innerHTML="";
 QUESTIONS.forEach((q,idx)=>{
   const li=document.createElement("li");
   const v=answers[idx]; li.textContent=`${q.t} — Svar: ${v} (${SCALE[v]})`;
   els.answersList.appendChild(li);
 });
}
els.btnRestart.onclick=()=>{answers.fill(null);i=0;els.screenResults.classList.add("hidden");els.screenTest.classList.remove("hidden");renderQ()};
els.btnPrint.onclick=()=>{els.answersBlock.open=true;window.print()};
renderQ();
</script>
</body>
</html>
