<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fysisk hälsa – Skattningstest</title>

<style>
:root{
  --bg:#f7faf8;
  --card:#ffffff;
  --muted:#4b5563;
  --text:#111827;
  --accent:#1f7a3a;
  --accent-dark:#16632f;
  --accent-soft:#eaf4ed;
  --ok:#1f7a3a;
  --warn:#b45309;
  --bad:#b91c1c;
  --bar:#1f7a3a;
  --bar-muted:#e5e7eb;
  --border:#e5e7eb;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.wrap{
  width:100%;
  max-width:900px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 18px 45px rgba(17,24,39,0.08);
  overflow:hidden;
}

header{
  padding:22px 24px;
  border-bottom:1px solid var(--border);
  display:flex;
  gap:16px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
}

h1{
  font-size:24px;
  margin:0;
  font-weight:800;
  color:#111827;
}

.muted{
  color:var(--muted);
  font-size:14px;
}

.bar{
  height:10px;
  width:100%;
  background:var(--bar-muted);
  border-radius:999px;
  overflow:hidden;
}

.bar span{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#1f7a3a,#2f9e55);
  transition:width 240ms ease;
}

.content{
  padding:28px 24px;
}

.q-meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.q-theme{
  font-size:13px;
  color:var(--muted);
}

.question{
  font-size:28px;
  line-height:1.4;
  margin:12px 0 20px;
  font-weight:700;
}

.scale{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:10px;
}

.option{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  height:60px;
  font-size:20px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all .2s ease;
}

.option:hover{
  background:var(--accent-soft);
  border-color:var(--accent);
}

.option.active{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent);
  outline:2px solid var(--accent);
}

.legend{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:12px;
  color:var(--muted);
}

.actions{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:28px;
}

.btn{
  border:none;
  border-radius:10px;
  padding:14px 18px;
  font-weight:700;
  cursor:pointer;
  transition:all .2s ease;
}

.btn.primary{
  background:var(--accent);
  color:white;
}

.btn.primary:hover{
  background:var(--accent-dark);
}

.btn.ghost{
  background:white;
  border:1px solid var(--accent);
  color:var(--accent);
}

.btn.ghost:hover{
  background:var(--accent-soft);
}

.result{
  display:grid;
  gap:14px;
  margin-top:16px;
  padding:18px;
  border:1px solid var(--border);
  border-radius:14px;
  background:#fff;
}

.meter{
  height:12px;
  background:var(--bar-muted);
  border-radius:999px;
  overflow:hidden;
}

.meter span{
  display:block;
  height:100%;
  width:0%;
  transition:width .3s ease;
}

.tag{
  padding:4px 10px;
  border-radius:999px;
  color:white;
  font-size:12px;
  font-weight:700;
}

.tag.ok{
  background:var(--ok);
}

.tag.warn{
  background:var(--warn);
}

.tag.bad{
  background:var(--bad);
}

.hidden{
  display:none;
}

.footer{
  padding:18px 24px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
}

a{
  color:var(--accent);
  text-decoration:none;
}

@media(max-width:640px){

  .question{
    font-size:22px;
  }

  .scale{
    grid-template-columns:repeat(5,1fr);
  }

  .option{
    height:52px;
    font-size:18px;
  }

}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<header>
  <div>
    <h1>Fysisk hälsa – Skattningstest</h1>
    <div class="muted">
      Besvara frågorna genom att välja 1–5
    </div>
  </div>

  <div style="min-width:260px;">
    <div class="bar">
      <span id="progress"></span>
    </div>

    <div class="muted" id="counter" style="text-align:right; margin-top:6px;">
      1 / 5
    </div>
  </div>
</header>

<div class="content" id="questionView">

  <div class="q-meta">
    <div class="q-theme" id="qTheme"></div>
    <div class="q-theme" id="qId"></div>
  </div>

  <div class="question" id="qText"></div>

  <div class="scale" id="scale"></div>

  <div class="legend">
    <span>1 = Stämmer inte alls</span>
    <span>5 = Stämmer helt</span>
  </div>

  <div class="actions">

    <button class="btn ghost" id="prevBtn">
      Föregående
    </button>

    <button class="btn primary" id="nextBtn">
      Nästa
    </button>

  </div>

</div>

<div class="content hidden" id="resultView">

  <h2>Resultat</h2>

  <div class="result">

    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong>Totalt hälsoläge</strong>
      <div id="totalTag" class="tag"></div>
    </div>

    <div class="meter">
      <span id="totalBar"></span>
    </div>

    <div id="totalText"></div>

  </div>

  <div class="actions">

    <button class="btn ghost" id="restartBtn">
      Starta om
    </button>

  </div>

</div>

<div class="footer">

  <div class="muted">
    Anonymt test enligt GDPR
  </div>

  <a href="#">
    Läs mer
  </a>

</div>

</div>
</div>

<script>

const QUESTIONS = [

{
theme:"Kondition",
text:"Jag orkar vardagsaktivitet utan att bli ovanligt trött."
},

{
theme:"Sömn",
text:"Jag vaknar oftast utvilad."
},

{
theme:"Stress",
text:"Jag känner mig sällan fysiskt utmattad av stress."
},

{
theme:"Kost",
text:"Jag äter regelbundet och håller jämn energinivå."
},

{
theme:"Motivation",
text:"Jag känner motivation till fysisk aktivitet."
}

];

const state = {
index:0,
answers:Array(QUESTIONS.length).fill(null)
};

const progress = document.getElementById("progress");
const counter = document.getElementById("counter");
const qTheme = document.getElementById("qTheme");
const qId = document.getElementById("qId");
const qText = document.getElementById("qText");
const scale = document.getElementById("scale");

const questionView = document.getElementById("questionView");
const resultView = document.getElementById("resultView");

const totalBar = document.getElementById("totalBar");
const totalTag = document.getElementById("totalTag");
const totalText = document.getElementById("totalText");

function renderQuestion(){

const q = QUESTIONS[state.index];

qTheme.textContent = q.theme;
qId.textContent = `Fråga ${state.index + 1}/${QUESTIONS.length}`;
qText.textContent = q.text;

scale.innerHTML = "";

for(let i = 1; i <= 5; i++){

const btn = document.createElement("button");

btn.className = "option";

if(state.answers[state.index] === i){
btn.classList.add("active");
}

btn.textContent = i;

btn.onclick = () => {

state.answers[state.index] = i;

renderQuestion();

};

scale.appendChild(btn);

}

progress.style.width = `${((state.index + 1) / QUESTIONS.length) * 100}%`;

counter.textContent = `${state.index + 1} / ${QUESTIONS.length}`;

}

document.getElementById("nextBtn").onclick = () => {

if(state.answers[state.index] === null){
return;
}

if(state.index < QUESTIONS.length - 1){

state.index++;

renderQuestion();

}else{

showResult();

}

};

document.getElementById("prevBtn").onclick = () => {

if(state.index > 0){

state.index--;

renderQuestion();

}

};

function showResult(){

questionView.classList.add("hidden");

resultView.classList.remove("hidden");

const total =
Math.round(
(state.answers.reduce((a,b)=>a+b,0) / (QUESTIONS.length * 5)) * 100
);

totalBar.style.width = `${total}%`;
totalBar.style.background =
"linear-gradient(90deg,#1f7a3a,#2f9e55)";

if(total >= 75){

totalTag.className = "tag ok";
totalTag.textContent = "Stark";

}else if(total >= 50){

totalTag.className = "tag warn";
totalTag.textContent = "Stabil";

}else{

totalTag.className = "tag bad";
totalTag.textContent = "Sårbar";

}

totalText.textContent = `Totalpoäng: ${total}/100`;

}

document.getElementById("restartBtn").onclick = () => {

state.index = 0;

state.answers = Array(QUESTIONS.length).fill(null);

resultView.classList.add("hidden");

questionView.classList.remove("hidden");

renderQuestion();

};

renderQuestion();

</script>

</body>
</html>
